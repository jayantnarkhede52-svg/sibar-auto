<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SIBAR AUTO PARTS LIMITED</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      background: var(--surface);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="./assets/sibar logo.png" alt="Sibar Auto Parts Logo">
        <span class="logo-subtext">ISO 9001:2015 & IATF 16949:2016</span>
      </a>
      <nav class="nav-links">
        <a href="index.html">HOME</a>
        <a href="products.html">PRODUCTS</a>
        <a href="investor/index.html">INVESTOR RELATIONS</a>
        <a href="awards.html">AWARDS</a>
        <a href="about.html">ABOUT US</a>
        <a href="contact.html" class="active">CONTACT</a>
        <a href="contact.html" class="btn btn-primary">REQUEST RFQ</a>
      </nav>
      <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-content">
      <span class="hero-badge">Get In Touch</span>
      <h1>Request an RFQ / Consultation</h1>
      <p>Connect with our manufacturing specialists to request quotes or schedule facility visits.</p>
    </div>
  </section>

  <section class="section section-bg-white">
    <div class="container">
      <div class="contact-form">
        <form onsubmit="event.preventDefault(); alert('RFQ Submitted Successfully. Our engineering team will contact you shortly.');">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="form-control" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Company</label>
            <input type="text" class="form-control" required placeholder="OEM Corp">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="form-control" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label>Project Details / Requirements</label>
            <textarea class="form-control" rows="5" required placeholder="Please describe your component requirements..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Submit RFQ Request</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <p>&copy; 2025 SIBAR Auto Parts Limited. All rights reserved.</p>
      </div>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
