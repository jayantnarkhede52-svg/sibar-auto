<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Sibar Auto Parts</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .contact-form {
      max-width: 600px;
      margin: 0 auto;
      background: var(--surface);
      padding: 3rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--secondary); }
    .form-control { width: 100%; padding: 1rem; border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-family: inherit; background: var(--surface-alt); outline: none; transition: var(--transition); }
    .form-control:focus { border-color: var(--primary); }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="container nav-container">
      <nav class="nav-links-left">
        <a href="index.html">HOME</a>
        <a href="products.html">PRODUCTS</a>
        <a href="about.html">ABOUT</a>
        <a href="awards.html">AWARDS</a>
      </nav>

      <div class="logo-center">
        <a href="index.html">
          <img src="./assets/sibar logo.png" alt="Sibar Auto Parts Logo">
        </a>
      </div>

      <div class="nav-actions-right">
        <div class="contact-phone">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          +91 877 2274400
        </div>
        <a href="contact.html" class="btn btn-primary">
          Get In Touch
          <span class="btn-icon">↗</span>
        </a>
      </div>
      <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-inner container" style="padding: 4rem 2rem;">
      <span class="hero-badge">Get In Touch</span>
      <h1 style="margin-bottom: 0;">Request an RFQ</h1>
    </div>
  </section>

  <section class="section container">
    <div class="contact-form">
      <form onsubmit="event.preventDefault(); alert('RFQ Submitted Successfully. Our engineering team will contact you shortly.');">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" class="form-control" required placeholder="OEM Corp">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Project Details</label>
          <textarea class="form-control" rows="5" required placeholder="Describe your component requirements..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: var(--radius-sm);">Submit Request</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="container">
    <div class="footer-grid">
      <div class="footer-col">
        <img src="./assets/sibar logo.png" alt="Sibar Logo" style="filter: brightness(0) invert(1); height: 40px; margin-bottom: 1.5rem;">
        <p style="color: #9ca3af; font-size: 0.875rem;">Premium OEM Manufacturing since 1983.</p>
      </div>
      <div class="footer-col">
        <h4>Company</h4>
        <a href="about.html">About Us</a>
        <a href="investor/index.html">Investor Relations</a>
        <a href="awards.html">Certifications</a>
      </div>
      <div class="footer-col">
        <h4>Capabilities</h4>
        <a href="products.html">Cylinder Heads</a>
        <a href="products.html">Crank Cases</a>
        <a href="products.html">CNC Machining</a>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <a href="mailto:sibarauto77@yahoo.com">sibarauto77@yahoo.com</a>
        <a href="contact.html">Request RFQ</a>
      </div>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
