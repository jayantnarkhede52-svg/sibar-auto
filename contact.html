<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | High Glassmorphism</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .contact-form {
      max-width: 600px;
      margin: 0 auto;
    }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .form-control {
      width: 100%;
      padding: 1rem;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      font-family: inherit;
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
      backdrop-filter: blur(10px);
    }
    .form-control:focus {
      border-color: var(--accent-cyan);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
    }
  </style>
</head>
<body>

  <!-- Ambient Background Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <!-- Header -->
  <header>
    <div class="container nav-container">
      <nav class="nav-links-left">
        <a href="index.html">HOME</a>
        <a href="products.html">PRODUCTS</a>
        <a href="about.html">ABOUT</a>
        <a href="awards.html">AWARDS</a>
      </nav>

      <div class="logo-center">
        <a href="index.html">
          <img src="./assets/sibar logo.png" alt="Sibar Auto Parts Logo">
        </a>
      </div>

      <div class="nav-actions-right">
        <a href="contact.html" class="btn btn-glass">
          Client Portal
        </a>
        <a href="contact.html" class="btn btn-cyan">
          Get In Touch
          <span class="btn-icon">↗</span>
        </a>
      </div>
      <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
    </div>
  </header>

  <section class="hero container" style="padding-bottom: 2rem;">
    <span class="hero-badge">Get In Touch</span>
    <h1 style="margin-bottom: 0;">Request an <span>RFQ</span></h1>
  </section>

  <section class="container" style="margin-bottom: 6rem;">
    <div class="glass-card contact-form">
      <form onsubmit="event.preventDefault(); alert('RFQ Submitted Successfully.');">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" class="form-control" required placeholder="Enter your name">
        </div>
        <div class="form-group">
          <label>Company</label>
          <input type="text" class="form-control" required placeholder="OEM Corp">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" required placeholder="name@company.com">
        </div>
        <div class="form-group">
          <label>Project Details</label>
          <textarea class="form-control" rows="5" required placeholder="Describe your component requirements..."></textarea>
        </div>
        <button type="submit" class="btn btn-cyan" style="width: 100%; border-radius: var(--radius-sm);">Submit Request</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-grid">
      <div class="footer-col">
        <img src="./assets/sibar logo.png" alt="Sibar Logo" style="height: 40px; margin-bottom: 1.5rem; filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));">
        <p style="color: var(--text-muted); font-size: 0.875rem;">Next-generation industrial manufacturing.</p>
      </div>
      <div class="footer-col">
        <h4>Company</h4>
        <a href="about.html">About Us</a>
        <a href="investor/index.html">Investor Relations</a>
        <a href="awards.html">Certifications</a>
      </div>
      <div class="footer-col">
        <h4>Capabilities</h4>
        <a href="products.html">Cylinder Heads</a>
        <a href="products.html">Crank Cases</a>
        <a href="products.html">CNC Machining</a>
      </div>
      <div class="footer-col">
        <h4>Contact</h4>
        <a href="mailto:sibarauto77@yahoo.com">sibarauto77@yahoo.com</a>
        <a href="contact.html">Request RFQ</a>
      </div>
    </div>
  </footer>
  <script src="./script.js"></script>
</body>
</html>
